name: CI Workflow

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-24.04
            ubuntu-version: "20.04"
            container: ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
          - arch: arm64
            runs-on: ubuntu-24.04
            ubuntu-version: "22.04"
            container: ubuntu:22.04@sha256:9abcaffc92a5279fff3a6a41635c0800ea33e528425fb389658806476e7defde
          # - arch: i386
          #   runs-on: ubuntu-24.04
          #   ubuntu-version: "20.04"
          #   container: ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214
          - arch: windows
            runs-on: ubuntu-24.04
            ubuntu-version: "24.04"
            container: ubuntu:24.04@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8
    
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}

    steps:
      - name: Set up environment
        shell: bash
        run: |
          # Set timezone non-interactively to avoid prompts
          export DEBIAN_FRONTEND=noninteractive
          ln -fs /usr/share/zoneinfo/UTC /etc/localtime

          apt-get update

          if [[ "${{ matrix.ubuntu-version }}" == "24.04" ]]; then
            # Ubuntu 24.04 has GCC-13 with full C++20 support
            if [[ "${{ matrix.arch }}" == "windows" ]]; then
              apt-get install -y build-essential pkg-config libc6-dev m4 g++-multilib autoconf libtool ncurses-dev unzip git python3 python3-zmq zlib1g-dev wget curl bsdmainutils automake mingw-w64 mingw-w64-tools cmake zip
              # Configure MinGW to use POSIX threads for C++20 support
              update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
              update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
            fi
          elif [[ "${{ matrix.ubuntu-version }}" == "22.04" ]]; then
            # Ubuntu 22.04 has native GCC-11 with C++20 support
            if [[ "${{ matrix.arch }}" == "arm64" ]]; then
              apt-get install -y build-essential pkg-config libc6-dev m4 autoconf libtool unzip git wget curl bsdmainutils automake g++-aarch64-linux-gnu ncurses-dev python3 python3-zmq zlib1g-dev
            fi
          else
            # Ubuntu 20.04 - install GCC-11 from toolchain PPA for C++20 support.
            # Pinned for reproducible builds: if the PPA drops this version the
            # build fails here instead of silently changing the compiler.
            GCC11="11.5.0-10ubuntu1~20~ppa3"
            apt-get install -y software-properties-common
            add-apt-repository -y ppa:ubuntu-toolchain-r/test
            apt-get update

            if [[ "${{ matrix.arch }}" == "amd64" ]]; then
              apt-get install -y build-essential pkg-config libc6-dev m4 autoconf libtool unzip git wget curl bsdmainutils automake ncurses-dev python3 python3-zmq zlib1g-dev gcc-11=$GCC11 g++-11=$GCC11 g++-11-multilib=$GCC11 cpp-11=$GCC11
              update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
              update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100
            elif [[ "${{ matrix.arch }}" == "i386" ]]; then
              dpkg --add-architecture i386
              apt-get update
              apt-get install -y build-essential pkg-config libc6-dev:i386 m4 autoconf libtool unzip git wget curl bsdmainutils automake ncurses-dev python3 python3-zmq zlib1g-dev gcc-11 g++-11 gcc-11-multilib g++-11-multilib
              update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
              update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100
            fi
          fi

      # Checkout after git is installed, so the job has a real clone: the version
      # string and SOURCE_DATE_EPOCH come from the actual commit.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set SOURCE_DATE_EPOCH
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $GITHUB_ENV

      - name: Set version and branch
        shell: bash
        run: |
          # Extract version from README.md or use a default method
          if [ -f README.md ]; then
            VERSION=$(head -n 1 README.md | cut -c 8-)
          else
            VERSION="dev"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV
          echo "UBUNTU_VERSION=${{ matrix.ubuntu-version }}" >> $GITHUB_ENV

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.arch }}" == "amd64" ]]; then
            ./zcutil/build.sh
          elif [[ "${{ matrix.arch }}" == "arm64" ]]; then
            HOST=aarch64-linux-gnu ./zcutil/build.sh
          elif [[ "${{ matrix.arch }}" == "i386" ]]; then
            HOST=i686-pc-linux-gnu ./zcutil/build.sh
          elif [[ "${{ matrix.arch }}" == "windows" ]]; then
            ./zcutil/build-win.sh
          fi

      - name: Binary checksums
        if: matrix.arch != 'windows'
        shell: bash
        run: |
          # Stripped binaries, as shipped. Compare with contrib/repro-build.sh from a second builder.
          mkdir -p checksum-tmp
          cp src/fluxd src/flux-cli src/flux-tx checksum-tmp/
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then STRIP_CMD="aarch64-linux-gnu-strip"; else STRIP_CMD="strip"; fi
          $STRIP_CMD checksum-tmp/fluxd checksum-tmp/flux-cli checksum-tmp/flux-tx
          (cd checksum-tmp && sha256sum fluxd flux-cli flux-tx) | tee SHA256SUMS-${{ matrix.arch }}.txt
          rm -rf checksum-tmp

      - name: Create deb package
        if: (matrix.arch != 'windows') && (github.event_name == 'workflow_dispatch' || github.event_name == 'release')
        shell: bash
        run: |
          # Create working directory for this architecture
          DEB_DIR="deb_package_${{ matrix.arch }}"
          cp -r deb_file/flux_${{ matrix.arch }} $DEB_DIR
          
          # Create the bin directory if it doesn't exist
          mkdir -p $DEB_DIR/usr/local/bin
          
          # Copy the binaries
          cp src/fluxd $DEB_DIR/usr/local/bin/
          cp src/flux-cli $DEB_DIR/usr/local/bin/
          cp src/flux-tx $DEB_DIR/usr/local/bin/
          
          # Set the correct strip command based on architecture
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            STRIP_CMD="aarch64-linux-gnu-strip"
          elif [[ "${{ matrix.arch }}" == "i386" ]]; then
            STRIP_CMD="strip"
          else
            STRIP_CMD="strip"  # amd64 uses native strip
          fi
          
          # Strip binaries to reduce size using the correct strip command
          $STRIP_CMD $DEB_DIR/usr/local/bin/fluxd
          $STRIP_CMD $DEB_DIR/usr/local/bin/flux-cli
          $STRIP_CMD $DEB_DIR/usr/local/bin/flux-tx
          
          # Copy fetch-params script if it exists (renamed to flux-fetch-params in deb)
          if [ -f zcutil/fetch-params.sh ]; then
            cp zcutil/fetch-params.sh $DEB_DIR/usr/local/bin/flux-fetch-params
            chmod 755 $DEB_DIR/usr/local/bin/flux-fetch-params
          fi
          
          # Set correct permissions (normalize first so umask doesn't leak into the package)
          chmod -R u=rwX,go=rX $DEB_DIR
          chmod 755 $DEB_DIR/usr/local/bin/fluxd
          chmod 755 $DEB_DIR/usr/local/bin/flux-cli
          chmod 755 $DEB_DIR/usr/local/bin/flux-tx
          
          # Set DEBIAN script permissions if they exist
          for script in postinst postrm preinst prerm; do
            if [ -f $DEB_DIR/DEBIAN/$script ]; then
              chmod 755 $DEB_DIR/DEBIAN/$script
            fi
          done
          
          # Update version in control file
          sed -i "s/Version: .*/Version: ${{ env.VERSION }}/" $DEB_DIR/DEBIAN/control
          
          # Build the deb package deterministically: fixed mtimes, root ownership
          find $DEB_DIR -exec touch -h -d "@${SOURCE_DATE_EPOCH}" {} +
          dpkg-deb --root-owner-group --build $DEB_DIR flux-${{ matrix.arch }}-${{ env.VERSION }}-${{ env.BRANCH }}-${{ github.run_id }}.deb

      - name: Package binaries (tar.gz)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        shell: bash
        run: |
          if [[ "${{ matrix.arch }}" == "windows" ]]; then
            # Strip binaries to reduce size
            strip ./src/fluxd.exe ./src/flux-cli.exe ./src/flux-tx.exe
            
            # Copy binaries and scripts
            cp ./src/fluxd.exe .
            cp ./src/flux-cli.exe .
            cp ./src/flux-tx.exe .
            if [ -f ./zcutil/fetch-params.bat ]; then
              cp ./zcutil/fetch-params.bat .
            fi
            
            # Create zip archive for Windows
            touch -d "@${SOURCE_DATE_EPOCH}" fluxd.exe flux-cli.exe flux-tx.exe $([ -f fetch-params.bat ] && echo fetch-params.bat)
            TZ=UTC zip -X Flux-Windows-${{ env.VERSION }}-${{ env.BRANCH }}-${{ github.run_id }}.zip fluxd.exe flux-cli.exe flux-tx.exe $([ -f fetch-params.bat ] && echo fetch-params.bat)
          else
            # Set the correct strip command based on architecture
            if [[ "${{ matrix.arch }}" == "arm64" ]]; then
              STRIP_CMD="aarch64-linux-gnu-strip"
            elif [[ "${{ matrix.arch }}" == "i386" ]]; then
              STRIP_CMD="strip"
            else
              STRIP_CMD="strip"  # amd64 uses native strip
            fi
            
            # Strip binaries to reduce size using the correct strip command
            $STRIP_CMD ./src/fluxd ./src/flux-cli ./src/flux-tx
            if [ -f ./src/flux-gtest ]; then
              $STRIP_CMD ./src/flux-gtest
            fi
            
            # Copy binaries to root directory to avoid nested paths in tar
            cp ./src/fluxd .
            cp ./src/flux-cli .
            cp ./src/flux-tx .
            if [ -f ./src/flux-gtest ]; then
              cp ./src/flux-gtest .
            fi
            # Keep original fetch-params.sh name in tar.gz
            if [ -f ./zcutil/fetch-params.sh ]; then
              cp ./zcutil/fetch-params.sh .
            fi
            
            if [[ "${{ matrix.arch }}" == "amd64" ]]; then NAME=Linux; elif [[ "${{ matrix.arch }}" == "arm64" ]]; then NAME=arm; else NAME=i386; fi
            FILES="fluxd flux-cli flux-tx $([ -f flux-gtest ] && echo flux-gtest) $([ -f fetch-params.sh ] && echo fetch-params.sh)"
            # Deterministic archive: sorted entries, fixed mtimes and owners, no gzip timestamp
            touch -d "@${SOURCE_DATE_EPOCH}" $FILES
            tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner -cf - $FILES | gzip -n > Flux-$NAME-${{ env.VERSION }}-${{ env.BRANCH }}-${{ github.run_id }}.tar.gz
          fi

      - name: Upload to Release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}-{1}-{2}', env.VERSION, env.BRANCH, github.run_id) }}
          name: ${{ github.event_name == 'release' && github.event.release.name || format('Flux v{0}-{1}-{2}', env.VERSION, env.BRANCH, github.run_id) }}
          prerelease: ${{ github.event_name != 'release' }}
          files: |
            *.deb
            *.tar.gz
            *.zip
            SHA256SUMS-*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 